<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f3f2f1; }
        h2 { color: #0078d4; margin-top: 0; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a9e; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 3px; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 13px; min-height: 20px; }
        .success { background: #dff6dd; color: #107c10; }
        .error { background: #fde7e9; color: #a80000; }
    </style>
</head>
<body>
    <h2>🛠️ PQ Web Simulator</h2>
    
    <div class="btn-group">
        <label>Colunas p/ Manter (ex: 1,2,5):</label>
        <input type="text" id="colsToKeep" placeholder="1,2,5">
        <button onclick="chooseColumns()">✂️ Manter Colunas</button>

        <label>Filtrar Coluna (letra):</label>
        <input type="text" id="filterCol" placeholder="Ex: C">
        <label>Valor:</label>
        <input type="text" id="filterVal" placeholder="Ex: JP">
        <button onclick="applyFilter()">🔍 Aplicar Filtro</button>

        <label>Delimitador:</label>
        <input type="text" id="delimiter" value="-" style="width: 60px;">
        <button onclick="splitByDelimiter()">➗ Dividir Texto</button>

        <button onclick="transformText('UPPER')">️ MAIÚSCULA</button>
        <button onclick="transformText('LOWER')">️ minúscula</button>
    </div>

    <div id="status"> Carregando...</div>
    <script src="functions.js"></script>
</body>
</html>
