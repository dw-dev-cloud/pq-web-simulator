<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQ Web Simulator</title>
    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Seu CSS -->
    <link rel="stylesheet" href="taskpane.css">
</head>
<body>
    <h2>🛠️ PQ Web Simulator</h2>

    <!-- SELETOR DE TEMAS (VERSÃO FINAL LIMPA) -->
    <div class="section theme-section">
        <div class="theme-header">
            <label>TEMA</label>
            <button id="toggle-theme-btn">🎨 ESCOLHER</button>
        </div>

        <!-- Lista começa escondida -->
        <div id="theme-list" class="theme-selector" style="display: none;">
            <button class="theme-btn active" data-theme="dark-tech" style="background:#6c5ce7" title="Dark Tech"></button>
            <button class="theme-btn" data-theme="ocean" style="background:#3b82f6" title="Ocean"></button>
            <button class="theme-btn" data-theme="sunset" style="background:#ff6b6b" title="Sunset"></button>
            <button class="theme-btn" data-theme="forest" style="background:#4caf50" title="Forest"></button>
            <button class="theme-btn" data-theme="cyberpunk" style="background:#ff00ff" title="Cyberpunk"></button>
            <button class="theme-btn" data-theme="light" style="background:#228be6" title="Light"></button>
            <button class="theme-btn" data-theme="royal" style="background:#d4af37" title="Royal"></button>
            <button class="theme-btn" data-theme="midnight" style="background:#4e54c8" title="Midnight"></button>
            <button class="theme-btn" data-theme="cherry" style="background:#e53935" title="Cherry"></button>
            <button class="theme-btn" data-theme="slate" style="background:#78909c" title="Slate"></button>
        </div>
    </div>

    <!-- CONTROLES DO SIMULADOR -->
    <div class="btn-group section">
        
        <div class="control-group">
            <label>Colunas p/ Manter (ex: 1,2,5):</label>
            <input type="text" id="colsToKeep" placeholder="1,2,5">
            <button id="btn-keep-cols">✂️ Manter Colunas</button>
        </div>

        <div class="control-group">
            <label>Filtrar Coluna (letra):</label>
            <input type="text" id="filterCol" placeholder="Ex: C">
            
            <label>Valor:</label>
            <input type="text" id="filterVal" placeholder="Ex: JP">
            
            <button id="btn-filter">🔍 Aplicar Filtro</button>
        </div>

        <div class="control-group">
            <label>Delimitador:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="delimiter" value="-" style="width: 60px;">
                <button id="btn-split" style="flex: 1;">➗ Dividir Texto</button>
            </div>
        </div>

        <div class="control-group">
            <button id="btn-upper">⬆️ MAIÚSCULA</button>
            <button id="btn-lower">⬇️ minúscula</button>
        </div>

    </div>

    <!-- STATUS -->
    <div id="status">Carregando...</div>

    <!-- Seu JS -->
    <script src="functions.js"></script>
</body>
</html>
